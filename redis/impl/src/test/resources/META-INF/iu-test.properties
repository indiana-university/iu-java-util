# Lettuce's codec classes pull Netty in, and Netty announces its chosen logging
# framework at FINE the first time it is touched. That happens during class
# initialization here -- LettuceConnection holds its codec in a static field --
# so it lands in whichever test loads the class first, rather than in one that
# has declared an interest in log output.
iu.util.test.platformLoggers=io.netty
